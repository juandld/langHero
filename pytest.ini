[pytest]
testpaths = tests
pythonpath = backend .
# voice_generation_test imports operations.scripts.generate_voices which
# imports a `voice_cache` module that doesn't exist in-tree. Ignoring at
# collection unblocks every other test; drop this line if voice_cache lands.
addopts = -ra --ignore=tests/voice_generation_test.py --ignore=tests/improvements
filterwarnings =
    ignore:.*on_event is deprecated.*:DeprecationWarning
